services:
  router:
    image: ghcr.io/idriz-hax/model-stead:v0.2.0
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config.yaml
      # Container/listener port; keep in sync with the port mapping and config.yaml server.address.
      ROUTER_CONTAINER_PORT: "8080"
      # Supply secret values through the TrueNAS App environment editor.
      LLAMA_SWAP_API_KEY: ${LLAMA_SWAP_API_KEY:-}
    ports:
      # HOST_BIND:HOST_PORT:CONTAINER_PORT. Change host port independently if needed.
      - "127.0.0.1:8080:8080"
    volumes:
      # Replace YOUR_POOL with your TrueNAS pool name. Create these child datasets:
      # modelstead/config (put config.yaml here), modelstead/data, modelstead/backups.
      # The app uses /app/config.yaml, /app/data, and /app/backups in the container.
      - /mnt/YOUR_POOL/modelstead/config/config.yaml:/app/config.yaml:ro
      - /mnt/YOUR_POOL/modelstead/data:/app/data
      - /mnt/YOUR_POOL/modelstead/backups:/app/backups
