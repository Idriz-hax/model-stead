server:
  address: ":8080"
  # Set to the exact HTTPS browser origin served by your TLS reverse proxy.
  public_url: "https://<router-public-host>"
database:
  path: "/app/data/router.db"
logging:
  level: "info"
backup:
  enabled: true
  directory: "/app/backups"
  interval: "24h"
  max_age: "720h"
  max_backups: 14
scheduler:
  policy: "weighted_round_robin"
  global_capacity: 4
  default_weight: 1
  max_queued: 100
  max_active_when_contended: 2
  max_wait: "30m"
  global_max_queued: 500
  work_conserving: true
  cancellation_grace: "30s"
gateway:
  enabled: false
  # If deliberately enabling the gateway, use the TrueNAS node LAN address
  # and llama-swap's host-published port, not a container-only address.
  base_url: "http://<truenas-node-address>:<llama-swap-host-published-port>"
  spool_dir: ""
  max_body_bytes: 20971520
  spool_budget_bytes: 268435456
auth:
  api_key_enabled: true
  ip_fallback_enabled: false
  trusted_proxy_cidrs: []
  anonymous:
    enabled: false
    cidrs: []
    max_identities: 100000
    secret_env: ""
  admin:
    bootstrap_username: ""
    display_name: ""
    # Supply the value of this named environment variable via TrueNAS.
    password_env: "ADMIN_BOOTSTRAP_PASSWORD"
