server:
  # Internal listener port; keep in sync with ROUTER_CONTAINER_PORT and the
  # container-side (last) port in the Compose mapping. Host port may differ.
  address: ":8080"
  # Set to the exact HTTPS browser origin served by your TLS reverse proxy.
  public_url: "https://<router-public-host>"
database:
  # Keep persistent data on the /app/data mount.
  path: "/app/data/router.db"
logging:
  level: "info"
backup:
  enabled: true
  # Keep backups on the separate /app/backups mount.
  directory: "/app/backups"
  interval: "24h"
  max_age: "720h"
  max_backups: 14
scheduler:
  policy: "weighted_round_robin"
  global_capacity: 4
  default_weight: 1
  max_queued: 100
  max_active_when_contended: 2
  max_wait: "30m"
  global_max_queued: 500
  work_conserving: true
  cancellation_grace: "30s"
gateway:
  enabled: false
  # If deliberately enabling the gateway, use the TrueNAS node LAN address
  # and llama-swap's host-published port (not its container-only port/address).
  # Example: http://192.168.1.20:11435 when llama-swap publishes host port 11435.
  base_url: "http://<truenas-node-address>:<llama-swap-host-published-port>"
  # Keep spools under /app/data unless adding a separate persistent volume.
  spool_dir: "/app/data/spool"
  max_body_bytes: 20971520
  spool_budget_bytes: 268435456
auth:
  api_key_enabled: true
  ip_fallback_enabled: false
  trusted_proxy_cidrs: []
  anonymous:
    enabled: false
    cidrs: []
    max_identities: 100000
    secret_env: ""
